name: RunYourEvent Production Rebrand

on:
  push:
    branches:
      - runyourevent-rebrand
    paths:
      - .github/workflows/runyourevent-rebrand.yml

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://runyourevent.com
      NEXT_PUBLIC_SUPABASE_URL: https://phhpiqwvgwlgjmyiksqe.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Di0kT3dAcoP9dHlBrg-rHQ_ISw-26-9
      ANTHROPIC_API_KEY: build-only-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder

    steps:
      - uses: actions/checkout@v4
        with:
          ref: runyourevent-rebrand
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply RunYourEvent public brand and product architecture
        shell: python
        run: |
          from pathlib import Path

          # Public-surface rename only. Internal dengine_* database identifiers remain untouched.
          for root in [Path('app'), Path('components')]:
              for path in root.rglob('*'):
                  if path.suffix not in {'.ts', '.tsx'}:
                      continue
                  text = path.read_text(encoding='utf-8')
                  text = text.replace('hello@dengine.app', 'hello@runyourevent.com')
                  text = text.replace('DEngine', 'RunYourEvent')
                  text = text.replace('Event Execution Intelligence', 'Event Execution Platform')
                  text = text.replace('Event execution intelligence', 'Event execution platform')
                  text = text.replace('event-planning and execution-intelligence software', 'event execution software')
                  text = text.replace('event-planning output', 'event-execution output')
                  path.write_text(text, encoding='utf-8')

