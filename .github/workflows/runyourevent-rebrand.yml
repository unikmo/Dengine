          Path('app/privacy/page.tsx').write_text(r'''import type { Metadata } from 'next'
export const metadata:Metadata={title:'RunYourEvent Privacy Policy',alternates:{canonical:'/privacy'}}
const S=({title,children}:{title:string,children:React.ReactNode})=><section><h2 className="text-xl font-black text-[#23324a]">{title}</h2><div className="mt-3 space-y-3 text-sm leading-7 text-[#5f6d80]">{children}</div></section>
export default function Page(){return <main className="bg-[#fbfaf7]"><article className="shell max-w-4xl py-20"><p className="eyebrow">Privacy</p><h1 className="display mt-4 text-5xl font-black">Privacy Policy</h1><p className="mt-5 text-sm text-[#8a93a2]">Last updated: 16 August 2026</p><div className="mt-10 space-y-9"><S title="1. Controller"><p>PlanetHike OÜ, Järvevana tee 9, 11314 Tallinn, Estonia, is the controller for RunYourEvent. Contact: hello@runyourevent.com.</p></S><S title="2. Data RunYourEvent processes"><p>RunYourEvent processes information you submit about an event, technical request data, contact details when you contact us, and payment-related identifiers required to fulfil a purchase. Card details are handled by Stripe and are not stored by RunYourEvent.</p></S><S title="3. Purposes and legal bases"><p>We process event inputs to provide the requested preview and paid execution plan, security and abuse-prevention data for legitimate interests, and transaction records to comply with legal and accounting obligations.</p></S><S title="4. AI-assisted processing"><p>Event briefs may be sent to Anthropic through its API to generate structured event-execution output. Do not submit unnecessary sensitive personal data in an event brief.</p></S><S title="5. Service providers"><p>RunYourEvent uses Vercel for hosting and application delivery, Supabase for database services, Anthropic for AI-assisted plan generation, and Stripe for checkout, payments, tax-related payment functionality and payment records.</p></S><S title="6. International processing"><p>Some providers may process data outside the European Economic Area. Where required, appropriate transfer mechanisms are used by the relevant provider/controller arrangement.</p></S><S title="7. Retention"><p>Unpurchased encrypted plan drafts are designed to expire after 48 hours. Transaction and accounting information may be retained for the periods required by applicable law. Support correspondence is retained only as long as reasonably necessary.</p></S><S title="8. Your rights"><p>Subject to applicable law, you may request access, correction, deletion, restriction, portability or object to certain processing. You may also lodge a complaint with a competent data-protection authority.</p></S><S title="9. Cookies and similar technologies"><p>RunYourEvent is designed to operate without non-essential advertising cookies at launch. If optional analytics or marketing technologies are introduced, the consent mechanism and this policy will be updated before activation where consent is required.</p></S><S title="10. Contact"><p>Privacy requests: <a className="underline" href="mailto:hello@runyourevent.com">hello@runyourevent.com</a>.</p></S></div></article></main>}
''', encoding='utf-8')

          Path('app/terms/page.tsx').write_text(r'''import type { Metadata } from 'next'
export const metadata:Metadata={title:'RunYourEvent Terms and Conditions',alternates:{canonical:'/terms'}}
const S=({title,children}:{title:string,children:React.ReactNode})=><section><h2 className="text-xl font-black text-[#23324a]">{title}</h2><div className="mt-3 space-y-3 text-sm leading-7 text-[#5f6d80]">{children}</div></section>
export default function Page(){return <main className="bg-[#fbfaf7]"><article className="shell max-w-4xl py-20"><p className="eyebrow">Terms</p><h1 className="display mt-4 text-5xl font-black">Terms & Conditions</h1><p className="mt-5 text-sm text-[#8a93a2]">Last updated: 16 August 2026</p><div className="mt-10 space-y-9"><S title="1. Provider and scope"><p>RunYourEvent is provided by PlanetHike OÜ, Järvevana tee 9, 11314 Tallinn, Estonia. These terms apply to the RunYourEvent website, free previews, single-event purchases and related digital services unless a separate written Teams & Agencies agreement applies.</p></S><S title="2. Service"><p>RunYourEvent is an event execution platform. It uses event inputs and structured execution logic, including AI-assisted generation, to produce operating models, tasks, dependencies, timing, approvals, completion criteria, risks and related execution information.</p><p>RunYourEvent is decision-support software. It is not legal, regulatory, engineering, safety, insurance, tax or professional certification advice.</p></S><S title="3. Free preview"><p>The free preview is an evaluation view of the event architecture and selected plan information. It is not represented as the complete purchased execution plan.</p></S><S title="4. Single-event plans"><p>Essential is USD 19 per event and is intended as a complete right-sized execution plan for a straightforward event. Professional is USD 39 per event and adds deeper execution intelligence such as approval, risk, contingency, vendor/procurement and critical-path detail. RunYourEvent does not deliberately remove necessary tasks from an Essential plan merely to force an upgrade.</p></S><S title="5. Payment"><p>Payments are processed by Stripe. The price, applicable taxes and total payable amount are shown before the order is completed. A purchase is associated with the event-plan draft identified during checkout.</p></S><S title="6. Immediate digital delivery and consumers"><p>Where consumer withdrawal rights apply, RunYourEvent asks for an express request to begin delivery of the digital service/content immediately and an acknowledgement of the consequences before checkout. Statutory rights that cannot lawfully be waived remain unaffected.</p></S><S title="7. User responsibilities"><p>You are responsible for the accuracy of event information supplied to RunYourEvent and for reviewing the resulting plan before relying on it. You must independently verify permits, legal requirements, safety measures, insurance, venue rules, supplier commitments, technical specifications and deadlines that could materially affect people, property or compliance.</p></S><S title="8. AI and plan accuracy"><p>AI-assisted output can contain omissions, assumptions or errors. RunYourEvent is designed to improve execution structure, not to replace qualified judgement. No guarantee is made that an event will succeed, be profitable, be legally compliant or be free of operational incidents.</p></S><S title="9. Licence and intellectual property"><p>Subject to payment, you may use the purchased plan for the event for which it was generated, including normal internal business use and collaboration with suppliers and team members. RunYourEvent software, branding, product design and underlying system remain the intellectual property of their respective owner/licensor. You may not resell or reproduce RunYourEvent itself as a competing service.</p></S><S title="10. Availability"><p>We may maintain, change or improve the service and may suspend access where necessary for security, maintenance, abuse prevention or legal reasons. We do not promise uninterrupted availability.</p></S><S title="11. Liability"><p>Nothing in these terms excludes or limits liability where exclusion is prohibited by applicable law, including liability for intent, gross negligence, or injury to life, body or health where applicable. For ordinary negligence, liability may be limited to breaches of essential contractual duties and foreseeable typical damage to the extent permitted by law. Mandatory consumer rights remain unaffected.</p></S><S title="12. Refunds"><p>Refund requests are assessed in light of applicable statutory rights, the digital-delivery status and the circumstances of the transaction. Contact hello@runyourevent.com with the checkout email and transaction details.</p></S><S title="13. Governing law"><p>These terms are governed by the laws applicable to PlanetHike OÜ without depriving consumers of mandatory protections available under the law of their habitual residence where such protections apply. Mandatory jurisdiction rules remain unaffected.</p></S><S title="14. Contact"><p>PlanetHike OÜ · Järvevana tee 9 · 11314 Tallinn · Estonia · hello@runyourevent.com · +49 (0)163 466 8380.</p></S></div></article></main>}
''', encoding='utf-8')

          Path('components/EventTypeLanding.tsx').write_text(r'''import { ArrowRight, Check, GitBranch } from 'lucide-react'
export type EventTypeLandingProps={eyebrow:string;title:string;lead:string;promise:string;workstreams:string[];proof:string[]}
export default function EventTypeLanding({eyebrow,title,lead,promise,workstreams,proof}:EventTypeLandingProps){return <main className="bg-[#fbfaf7]"><section className="shell grid gap-12 py-20 lg:grid-cols-[1fr_.75fr] lg:items-center"><div><p className="eyebrow">{eyebrow}</p><h1 className="display mt-4 text-5xl font-black leading-[1.01] sm:text-6xl">{title}</h1><p className="mt-6 max-w-3xl text-lg leading-8 text-[#687386]">{lead}</p><p className="mt-5 text-lg font-black text-[#8b7440]">{promise}</p><div className="mt-8 flex flex-wrap gap-3"><a href="/custom" className="btn-primary">Build my event plan <ArrowRight className="ml-2" size={15}/></a><a href="/templates" className="btn-secondary">Explore templates</a></div></div><aside className="rounded-[30px] bg-[#15233f] p-7 text-white"><p className="text-[10px] font-black uppercase tracking-[.13em] text-[#efcd6d]">Typical workstreams</p><div className="mt-5 space-y-3">{workstreams.map(x=><div key={x} className="flex items-center gap-3 rounded-xl border border-white/10 bg-white/[.04] p-3"><GitBranch size={15} className="text-[#efcd6d]"/><span className="font-bold">{x}</span></div>)}</div></aside></section><section className="border-y border-black/[.055] bg-[#f5f2ea] py-20"><div className="shell"><p className="eyebrow">Execution control</p><h2 className="display mt-4 max-w-3xl text-4xl font-black">Know what has to happen next — and what cannot happen yet.</h2><div className="mt-10 grid gap-5 md:grid-cols-3">{proof.map(x=><article key={x} className="rounded-[26px] border border-black/[.055] bg-white p-6"><Check size={17} className="text-[#9a7b31]"/><p className="mt-4 font-black leading-6 text-[#23324a]">{x}</p></article>)}</div></div></section><section className="shell py-20 text-center"><p className="eyebrow justify-center">RunYourEvent</p><h2 className="display mt-4 text-4xl font-black">Plan it. Assign it. Run it.</h2><a href="/custom" className="btn-primary mt-7">Build my event plan <ArrowRight className="ml-2" size={15}/></a></section></main>}
''', encoding='utf-8')

          pages={
          'app/weddings/page.tsx':r'''import type { Metadata } from 'next';import EventTypeLanding from '@/components/EventTypeLanding';export const metadata:Metadata={title:'Wedding Event Execution Software',description:'Turn a wedding into one accountable operating plan covering venue, vendors, guests, ceremony, reception, deadlines and run of show.',alternates:{canonical:'/weddings'}};export default function Page(){return <EventTypeLanding eyebrow="Private events · Weddings" title="Know exactly what needs to happen next." lead="RunYourEvent turns the wedding date, venue context and delivery priorities into one connected execution plan — without forcing the event into a generic checklist." promise="Every vendor. Every handoff. Every deadline." workstreams={['Venue & ceremony','Guests & communications','Catering & hospitality','Vendors & production','Logistics & transport','Run of Show']} proof={['See vendor and venue dependencies before they become late surprises.','Give family, planner and suppliers clear ownership instead of scattered messages.','Define completion criteria so “done” means something specific before event day.']}/> }''',
          'app/corporate/page.tsx':r'''import type { Metadata } from 'next';import EventTypeLanding from '@/components/EventTypeLanding';export const metadata:Metadata={title:'Corporate Event Execution Software',description:'Corporate event execution software for workstreams, owners, approvals, dependencies, suppliers, deadlines and readiness.',alternates:{canonical:'/corporate'}};export default function Page(){return <EventTypeLanding eyebrow="Corporate events" title="Give every workstream an owner and every deadline visibility." lead="From customer conferences and executive retreats to launches and training events, RunYourEvent creates the execution model before the team starts chasing status." promise="One operating plan across teams, suppliers and approvals." workstreams={['Venue & logistics','Content & speakers','Production & AV','Guest operations','Marketing & communications','Procurement & approvals']} proof={['Anchor every deadline backwards from the fixed event date.','Expose approval gates and critical dependencies across functions.','See what is blocked, late or at risk before it reaches event day.']}/> }''',
          'app/agencies/page.tsx':r'''import type { Metadata } from 'next';import EventTypeLanding from '@/components/EventTypeLanding';export const metadata:Metadata={title:'Event Operations Software for Agencies',description:'Standardize event execution across clients without forcing every event into the same template.',alternates:{canonical:'/agencies'}};export default function Page(){return <EventTypeLanding eyebrow="Event teams & agencies" title="Standardize execution without forcing every event into the same template." lead="RunYourEvent gives agencies a repeatable operating structure while adapting workstreams, dependencies, approvals, vendors and deadlines to each client brief." promise="Reusable execution logic. Event-specific operating plans." workstreams={['Client approvals','Venue & production','Creative & content','Suppliers & procurement','Guest operations','Show calling & delivery']} proof={['Create a consistent execution standard across account teams.','Keep client decisions connected to downstream work and supplier deadlines.','Use reference models without pretending every event is identical.']}/> }''',
          'app/venues/page.tsx':r'''import type { Metadata } from 'next';import EventTypeLanding from '@/components/EventTypeLanding';export const metadata:Metadata={title:'Event Operations Software for Hotels & Venues',description:'Coordinate clients, suppliers and internal venue teams from one event operating plan.',alternates:{canonical:'/venues'}};export default function Page(){return <EventTypeLanding eyebrow="Hotels & venues" title="Coordinate clients, suppliers and internal teams from one operating plan." lead="RunYourEvent makes handoffs between sales, banqueting, operations, AV, external vendors and the client visible — with owners, deadlines and approvals tied to the event date." promise="Fewer hidden handoffs. Clearer event readiness." workstreams={['Client requirements','Banqueting & catering','Rooms & guest flow','AV & production','External suppliers','Venue operations']} proof={['Turn client decisions into visible internal dependencies.','Give supplier cut-offs and room/production deadlines explicit ownership.','Create a shared definition of readiness before final event handover.']}/> }''',
          'app/event-types/page.tsx':r'''import type { Metadata } from 'next';import { ArrowRight } from 'lucide-react';export const metadata:Metadata={title:'Event Types | RunYourEvent',description:'RunYourEvent supports private events, corporate events, agencies, hotels and venues with event-specific execution models.',alternates:{canonical:'/event-types'}};const items=[['Weddings & private events','Know exactly what needs to happen next.','/weddings'],['Corporate events','Give every workstream an owner and every deadline visibility.','/corporate'],['Event teams & agencies','Standardize execution without forcing every event into the same template.','/agencies'],['Hotels & venues','Coordinate clients, suppliers and internal teams from one operating plan.','/venues']];export default function Page(){return <main className="bg-[#fbfaf7]"><section className="shell py-20"><p className="eyebrow">Event Types</p><h1 className="display mt-4 max-w-4xl text-5xl font-black sm:text-6xl">Different events. The same execution problem.</h1><p className="mt-6 max-w-3xl text-lg leading-8 text-[#687386]">Every event has a fixed outcome, limited time, accountable people and work that depends on other work. RunYourEvent adapts the operating model to the event instead of forcing the event into a generic template.</p><div className="mt-12 grid gap-5 md:grid-cols-2">{items.map(([t,b,h])=><a key={t} href={h} className="rounded-[28px] border border-black/[.055] bg-white p-7 transition hover:-translate-y-0.5 hover:border-[#c9aa57]"><h2 className="text-2xl font-black text-[#23324a]">{t}</h2><p className="mt-3 text-base leading-7 text-[#687386]">{b}</p><span className="mt-6 inline-flex items-center text-sm font-black text-[#9a7b31]">Explore <ArrowRight className="ml-2" size={14}/></span></a>)}</div></section></main>}''',
          'app/templates/page.tsx':r'''import type { Metadata } from 'next';import { ArrowRight, GitBranch, Layers3 } from 'lucide-react';export const metadata:Metadata={title:'Event Planning Templates, Tasks & Timelines',description:'Professional event execution templates and reference models for conferences, retreats, workshops, galas, launches and more.',alternates:{canonical:'/templates'}};const models=[['Corporate conference','Venue, content, production, guests and approvals'],['Executive retreat','Travel, accommodation, agenda and facilitation'],['Fundraising gala','Guests, sponsors, production, catering and stewardship'],['Product launch','Creative, production, press, guests and supplier deadlines']];export default function Page(){return <main className="bg-[#fbfaf7]"><section className="shell py-20"><p className="eyebrow">Templates & reference models</p><h1 className="display mt-4 max-w-4xl text-5xl font-black sm:text-6xl">Start from event knowledge. Never from a blank checklist.</h1><p className="mt-6 max-w-3xl text-lg leading-8 text-[#687386]">Templates are a starting point, not the product. RunYourEvent uses structured reference models and adapts the work to your event date, context, venue status and delivery complexity.</p><div className="mt-8 flex gap-3"><a href="/browse" className="btn-primary">Browse reference library <ArrowRight className="ml-2" size={15}/></a><a href="/custom" className="btn-secondary">Build my event plan</a></div><div className="mt-12 grid gap-5 md:grid-cols-2">{models.map(([t,b])=><article key={t} className="rounded-[26px] border border-black/[.055] bg-white p-6"><Layers3 className="text-[#9a7b31]" size={18}/><h2 className="mt-4 text-xl font-black text-[#23324a]">{t}</h2><p className="mt-2 text-sm leading-6 text-[#687386]">{b}</p><div className="mt-5 flex items-center gap-2 text-xs font-black uppercase tracking-[.1em] text-[#8b7440]"><GitBranch size={13}/>Dependency-aware</div></article>)}</div></section></main>}''',
          'app/resources/page.tsx':r'''import type { Metadata } from 'next';import { ArrowRight } from 'lucide-react';export const metadata:Metadata={title:'Event Execution Resources',description:'Practical resources for event workstreams, ownership, dependencies, approvals, risk, readiness and run of show.',alternates:{canonical:'/resources'}};const resources=[['How to build an event execution plan','Start with the event outcome and fixed date, then map workstreams, owners, dependencies and completion criteria.','/custom'],['Event templates and reference models','Use professional event knowledge without treating every event as identical.','/templates'],['Corporate event operations','Connect approvals, suppliers, production and guest operations into one delivery model.','/corporate'],['Agency event operations','Standardize the operating method while adapting each plan to the client brief.','/agencies']];export default function Page(){return <main className="bg-[#fbfaf7]"><section className="shell py-20"><p className="eyebrow">Resources</p><h1 className="display mt-4 max-w-4xl text-5xl font-black sm:text-6xl">Execution thinking for people who have to deliver the event.</h1><p className="mt-6 max-w-3xl text-lg leading-8 text-[#687386]">Practical guidance on turning event requirements into accountable work — without confusing execution with ticketing, attendee engagement or generic project management.</p><div className="mt-12 grid gap-5 md:grid-cols-2">{resources.map(([t,b,h])=><a key={t} href={h} className="rounded-[28px] border border-black/[.055] bg-white p-7 transition hover:-translate-y-0.5 hover:border-[#c9aa57]"><h2 className="text-xl font-black text-[#23324a]">{t}</h2><p className="mt-3 text-sm leading-6 text-[#687386]">{b}</p><span className="mt-6 inline-flex items-center text-sm font-black text-[#9a7b31]">Open resource <ArrowRight className="ml-2" size={14}/></span></a>)}</div></section></main>}''',
          'app/browse/layout.tsx':r'''import type { Metadata } from 'next';export const metadata:Metadata={title:'Event Execution Template Library',description:'Browse structured event reference models and use them as a starting point for a tailored RunYourEvent execution plan.',alternates:{canonical:'/browse'}};export default function Layout({children}:{children:React.ReactNode}){return children}'''
          }
          for name, content in pages.items():
              p=Path(name);p.parent.mkdir(parents=True,exist_ok=True);p.write_text(content,encoding='utf-8')

          Path('app/sitemap.ts').write_text(r'''import type { MetadataRoute } from 'next'
export default function sitemap():MetadataRoute.Sitemap { const base=process.env.NEXT_PUBLIC_SITE_URL||'https://runyourevent.com'; const paths=['','/event-types','/weddings','/corporate','/agencies','/venues','/templates','/browse','/resources','/custom','/pricing','/about','/contact','/imprint','/privacy','/terms']; return paths.map((path,i)=>({url:`${base}${path}`,lastModified:new Date(),changeFrequency:i===0?'weekly':'monthly',priority:i===0?1:path==='/custom'?0.95:['/event-types','/templates','/pricing'].includes(path)?0.8:0.65})) }
''', encoding='utf-8')

          # Refine legacy library wording after global brand rename.
          browse=Path('app/browse/page.tsx')
          text=browse.read_text(encoding='utf-8')
          text=text.replace('Event planning reference library','Event execution template library')
          text=text.replace('Start from event knowledge.','Start from execution knowledge.')
          text=text.replace('When you are ready to plan,','When you are ready to execute,')
          text=text.replace('Reference event models already available in RunYourEvent.','Structured reference models available in RunYourEvent.')
          browse.write_text(text,encoding='utf-8')

      - name: Verify public brand boundary
        run: |
          if grep -R --line-number --include='*.tsx' --include='*.ts' 'DEngine' app components; then
            echo 'Legacy DEngine public branding remains'
            exit 1
          fi
          if grep -R --line-number --include='*.tsx' --include='*.ts' 'Event Planning & Execution Intelligence' app components; then
            echo 'Obsolete planning-company positioning remains'
            exit 1
          fi
          grep -q 'Run your entire event' app/page.tsx
          grep -q 'Event Execution Platform' app/page.tsx
          grep -q 'Plan it. Assign it. Run it.' app/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit validated rebrand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components
          git commit -m "Rebrand DEngine public product as RunYourEvent event execution platform"
          git push origin HEAD:runyourevent-rebrand
