name: RunYourEvent Production Rebrand

on:
  push:
    branches:
      - runyourevent-rebrand
    paths:
      - .github/workflows/runyourevent-rebrand.yml

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: https://runyourevent.com
      NEXT_PUBLIC_SUPABASE_URL: https://phhpiqwvgwlgjmyiksqe.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_Di0kT3dAcoP9dHlBrg-rHQ_ISw-26-9
      ANTHROPIC_API_KEY: build-only-placeholder
      SUPABASE_SERVICE_ROLE_KEY: build-only-placeholder

    steps:
      - uses: actions/checkout@v4
        with:
          ref: runyourevent-rebrand
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply public rebrand
        run: python scripts/runyourevent_rebrand.py

      - name: Verify public positioning
        run: |
          if grep -R --line-number --include='*.tsx' --include='*.ts' 'DEngine' app components; then
            echo 'Legacy DEngine public branding remains'
            exit 1
          fi
          if grep -R --line-number --include='*.tsx' --include='*.ts' 'Event Planning & Execution Intelligence' app components; then
            echo 'Obsolete planning-company positioning remains'
            exit 1
          fi
          grep -q 'Run your entire event' app/page.tsx
          grep -q 'Event Execution Platform' app/page.tsx
          grep -q 'Plan it. Assign it. Run it.' app/page.tsx
          grep -q 'Run of Show' app/page.tsx

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit validated rebrand
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib
          git commit -m "Rebrand public product as RunYourEvent event execution platform"
          git push origin HEAD:runyourevent-rebrand
