export default function AboutPage(){return <main className="bg-[#fbfaf7]"><section className="shell py-20 sm:py-24"><div className="max-w-4xl"><p className="eyebrow">About RunYourEvent</p><h1 className="display mt-4 text-5xl font-black leading-[1.01] sm:text-6xl">Events do not fail because nobody made a list.<span className="block text-[#8b7440]">They fail in the gaps between the work.</span></h1><p className="mt-7 max-w-3xl text-lg leading-8 text-[#6d7889]">RunYourEvent is built around a simple premise: every event should have one connected operating plan showing what needs to happen, who owns it, what it depends on and what “done” actually means.</p></div></section><section className="border-y border-black/[.055] bg-[#f5f2ea] py-20"><div className="shell grid gap-5 md:grid-cols-3">{[[GitBranch,'Model relationships','Know what each task depends on and what becomes blocked when it slips.'],[Layers3,'Adapt event knowledge','Start from structured event models, then adapt the work to the actual event context.'],[ShieldCheck,'Make readiness observable','Owners, approvals, completion evidence and risk turn “we think we are ready” into something visible.']].map(([Icon,t,b]:any)=><article key={t} className="rounded-[26px] border border-black/[.055] bg-white p-6"><span className="grid h-10 w-10 place-items-center rounded-xl bg-[#15233f] text-[#efcd6d]"><Icon size={18}/></span><h2 className="mt-5 text-lg font-black text-[#23324a]">{t}</h2><p className="mt-2 text-sm leading-6 text-[#707b8c]">{b}</p></article>)}</div></section><section className="shell py-20 sm:py-24"><div className="grid gap-12 lg:grid-cols-[.8fr_1.2fr] lg:gap-20"><div><p className="eyebrow">Our category</p><h2 className="display mt-4 text-4xl font-black">Event Execution Platform.</h2></div><div className="space-y-5 text-base leading-7 text-[#687386]"><p>RunYourEvent is not trying to become a venue marketplace, registration system, ticketing product or attendee-engagement platform.</p><p>Its job is operational: turn an event into workstreams, tasks, owners, dependencies, backward deadlines, deliverables, approvals, risks and completion criteria.</p><p>Project-management tools remain useful execution environments. RunYourEvent focuses on constructing the event operating model that those tools assume the team already knows.</p></div></div><div className="mt-16 rounded-[32px] bg-[#15233f] p-8 text-white sm:p-10"><p className="text-[11px] font-black uppercase tracking-[.15em] text-[#efcd6d]">Plan it. Assign it. Run it.</p><div className="mt-3 flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between"><h2 className="max-w-2xl text-3xl font-black">Turn the next event into one executable operating plan.</h2><a href="/custom" className="btn-signal shrink-0">Build my event plan <ArrowRight className="ml-2" size={15}/></a></div></div></section></main>}
''', encoding='utf-8')

